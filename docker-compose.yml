version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: click-clothing-db-local
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: click_clothing
      MYSQL_USER: click_user
      MYSQL_PASSWORD: click_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
